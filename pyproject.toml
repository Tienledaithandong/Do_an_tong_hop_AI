[project]
name = "hivemind-rl"
version = "0.1.0"
description = "Reproduction and graph extension of Soma et al. (2026), 'The hive mind is a single reinforcement learning agent'"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.3",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pytest>=8.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
