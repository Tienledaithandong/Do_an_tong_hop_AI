name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/run_all.py --quick
      - run: python scripts/package_artifacts.py --quick --output out/ci-quick.zip
      - run: python scripts/package_artifacts.py --verify out/ci-quick.zip
